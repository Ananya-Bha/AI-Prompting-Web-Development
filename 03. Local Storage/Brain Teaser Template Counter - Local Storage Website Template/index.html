<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="panel counter-panel">
        <div class="controls">
          <button id="startButton" class="primary big-button" onClick="start()">
            Start
          </button>
        </div>

        <output id="counter" class="counter" aria-live="polite">0</output>
      </section>
    </main>

    <script>

      function start(){
        number=prompt("Start Counting from:")
        let next_num=number
        next_num=parseInt(next_num)
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
        document.getElementById("counter").textContent=next_num
        alert(next_num)
        next_num=next_num+1
      
      }
    </script>
  </body>
</html>
