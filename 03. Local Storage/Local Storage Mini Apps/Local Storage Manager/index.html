<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Storage Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Local Storage Manager</h1>

    <section class="storage-panel" aria-live="polite">
      <h2>Stored Items</h2>
      <div id="storageGrid" class="storage-grid"></div>
    </section>

    <section class="actions">
      <button id="removeSelected" type="button">Remove Selected</button>
      <button id="clearAll" type="button">Clear All</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
