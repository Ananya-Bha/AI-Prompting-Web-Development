<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over - Clicker Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- 
    This page appears when the game ends - either when the player wins or loses
    Think of this like the final scene of a movie - it wraps up the story!
    -->
    
    <h1>Game Over</h1>
    
    <!-- 
    Display the player's final score
    This number comes from the URL when other pages send the player here
    -->
    <p>Your Final Score:</p>
    <p style="font-size: 48px; font-weight: bold; color: #FFD700;">
        <span id="final-score">0</span> points
    </p>
    
    <!-- Button to play again -->
    <button id="play-again-button" class="game-button">Play Again</button>
    
    <script src="game.js"></script>
</body>
</html>
