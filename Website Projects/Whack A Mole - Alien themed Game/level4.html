<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 4 - Clicker Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- HUD - Game information display -->
    <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">4</span></div>
        <div id="lives" class="lives">
            <span>Lives:</span>
        </div>
        <button id="restart-button" class="game-button" style="font-size: 14px; padding: 8px 15px;">Restart Game</button>
    </div>
    
    <!-- The 3x3 game grid where moles appear -->
    <div class="game-grid">
        <div class="grid-square" id="square-0"></div>
        <div class="grid-square" id="square-1"></div>
        <div class="grid-square" id="square-2"></div>
        <div class="grid-square" id="square-3"></div>
        <div class="grid-square" id="square-4"></div>
        <div class="grid-square" id="square-5"></div>
        <div class="grid-square" id="square-6"></div>
        <div class="grid-square" id="square-7"></div>
        <div class="grid-square" id="square-8"></div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>

<!-- 
STUDENTS: Level 4 - THE FINAL CHALLENGE!

This is the hardest, fastest level. The visual design should reflect that!
This level should look and feel EPIC because it's the final boss battle.

Ideas for Level 4 customization:
- Intense colors (deep reds, electric blues, lightning yellows)
- Maximum visual effects and animations
- Dramatic borders and shadows
- Perhaps a different background entirely
- Make everything look more "extreme" or "dangerous"

Advanced ideas (if you learn more CSS later):
- Animated background gradients
- Screen shake effects when moles are missed
- Lightning or energy effects around the grid
- Dramatic color changes based on score

This is where you pull out all the stops - make it look AMAZING!
Players should feel like they're in the final battle of an epic game.
-->
