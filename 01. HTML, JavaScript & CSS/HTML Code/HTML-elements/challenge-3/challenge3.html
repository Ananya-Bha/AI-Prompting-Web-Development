<!doctype html>
<html>
    <head>
        <style>
            #classic-title {
                font-family: Georgia, serif;
                color: #2c3e50;
                font-size: 32px;
                margin-bottom: 10px;
            }

            #classic-text {
                font-family: Georgia, serif;
                color: #34495e;
                font-size: 16px;
                line-height: 1.6;
            }

            #modern-title {
                font-family: Arial, sans-serif;
                color: #e74c3c;
                font-size: 36px;
                font-weight: bold;
                margin-bottom: 15px;
            }

            #modern-text {
                font-family: Arial, sans-serif;
                color: #7f8c8d;
                font-size: 18px;
                line-height: 1.8;
            }
        </style>
    </head>
    <body>
        <!--Create your <h1> here-->
            <h1 id="modern-title">Welcome to CSS Styling</h1>

        <!--Create your <p> here-->
            <p id="modern-text">This is an example of how CSS can transform the appearance of text on a webpage. By linking different CSS rules to HTML elements, we can create entirely different visual experiences.</p>

    </body>
</html>
