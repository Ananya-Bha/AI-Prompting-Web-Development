<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 1 - Name Greeting</title>
  <link rel="stylesheet" href="../global-styles.css">
</head>

<body>
  <h1>Challenge 1: Name Greeting</h1>
  <p>Click the button to start the greeting!</p>

  <button onclick="greetUser()">Start</button>

  <script>
    function greetUser()
    {
      const userName = prompt("What is your name?");

      //Insert code to use the userName constant in an alert.
      alert("Hello "+userName+"!");

      alert("Great to meet you!");
    }
  </script>

</body>
</html>
