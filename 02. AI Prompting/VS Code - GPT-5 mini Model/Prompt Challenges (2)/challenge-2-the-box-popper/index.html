<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page" class="page">
  <div id="app" class="app">
    <h1 id="title" class="title">The Great Box Popper</h1>
    <p id="tagline" class="tagline">Tap a button. The matching box above disappears.</p>

    <p id="boxes" class="boxes">
      <span id="box-1" class="box">1</span>
      <span id="box-2" class="box">2</span>
      <span id="box-3" class="box">3</span>
      <span id="box-4" class="box">4</span>
      <span id="box-5" class="box">5</span>
      <span id="box-6" class="box">6</span>
      <span id="box-7" class="box">7</span>
      <span id="box-8" class="box">8</span>
      <span id="box-9" class="box">9</span>
      <span id="box-10" class="box">10</span>
    </p>

    <p id="pop-row" class="pop-row">
      <button id="pop-1" class="pop-btn" onclick="pop1()">1</button>
      <button id="pop-2" class="pop-btn" onclick="pop2()">2</button>
      <button id="pop-3" class="pop-btn" onclick="pop3()">3</button>
      <button id="pop-4" class="pop-btn" onclick="pop4()">4</button>
      <button id="pop-5" class="pop-btn" onclick="pop5()">5</button>
      <button id="pop-6" class="pop-btn" onclick="pop6()">6</button>
      <button id="pop-7" class="pop-btn" onclick="pop7()">7</button>
      <button id="pop-8" class="pop-btn" onclick="pop8()">8</button>
      <button id="pop-9" class="pop-btn" onclick="pop9()">9</button>
      <button id="pop-10" class="pop-btn" onclick="pop10()">10</button>
    </p>
  </div>
  <script src="script.js"></script>
</body>
</html>
