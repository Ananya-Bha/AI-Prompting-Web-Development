<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page" class="page">
  <div id="app" class="app">
    <h1 id="title" class="title theme">Red or Blue?</h1>
    <p id="caption" class="caption theme">Pick the colour you like.</p>

    <div id="cards" class="cards">
      <button id="card-a" class="card card-color-red" onclick="chooseA()">
        <img id="card-img-a" class="card-img hidden" src="" alt="">
        <span id="card-emoji-a" class="card-emoji hidden"></span>
        <span id="card-label-a" class="card-label">RED</span>
      </button>
      <button id="card-b" class="card card-color-blue" onclick="chooseB()">
        <img id="card-img-b" class="card-img hidden" src="" alt="">
        <span id="card-emoji-b" class="card-emoji hidden"></span>
        <span id="card-label-b" class="card-label">BLUE</span>
      </button>
    </div>

    <img id="buddy" class="buddy hidden" src="images/question.png" alt="Your buddy">
  </div>
  <script src="script.js"></script>
</body>
</html>
