<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page">
  <div id="app">
    <h1 id="title">The Water Riddle</h1>
    <p id="tagline">Two jugs — 5 litres and 3 litres. Land exactly 4 litres in either jug, using only the buttons. (The bomb in the park ticks while you think.)</p>

    <p id="jug-a">Jug A: <span id="a-level">0</span> / 5 L</p>
    <button id="fill-a" onclick="fillA()">FILL A</button>
    <button id="empty-a" onclick="emptyA()">EMPTY A</button>
    <button id="pour-ab" onclick="pourAB()">POUR A TO B</button>

    <p id="jug-b">Jug B: <span id="b-level">0</span> / 3 L</p>
    <button id="fill-b" onclick="fillB()">FILL B</button>
    <button id="empty-b" onclick="emptyB()">EMPTY B</button>
    <button id="pour-ba" onclick="pourBA()">POUR B TO A</button>

    <button id="reset-btn" onclick="resetGame()">RESET</button>
    <div id="verdict"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
