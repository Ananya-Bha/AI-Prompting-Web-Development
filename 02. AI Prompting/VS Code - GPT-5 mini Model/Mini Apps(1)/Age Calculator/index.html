<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        body {
            background: #fff;
            color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        input[type="date"] {
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #000;
            background: #fff;
            color: #000;
            margin-bottom: 1rem;
        }
        button {
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <h1>Age Calculator</h1>
    <div class="subtitle">Enter your Birthdate:</div>
    <input type="date" id="birthdate" max="2025-07-22">
    <br>
    <button onclick="calculateAge()">Calculate Age</button>
    <script>
        function calculateAge() {
            const birthdateInput = document.getElementById('birthdate').value;
            if (!birthdateInput) {
                alert('Please select your birthdate.');
                return;
            }
            const birthDate = new Date(birthdateInput);
            const year2025 = 2025;
            let age = year2025 - birthDate.getFullYear();
            const today2025 = new Date('2025-07-22');
            // If birthday hasn't occurred yet in 2025, subtract 1
            if (
                today2025.getMonth() < birthDate.getMonth() ||
                (today2025.getMonth() === birthDate.getMonth() && today2025.getDate() < birthDate.getDate())
            ) {
                age--;
            }
            alert(`You are ${age} years old in 2025.`);
        }
    </script>
</body>
</html>
