<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The head section contains metadata about the document -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- The header section of the website -->
    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <!-- The main content area -->
    <main>
        <!-- Hero section with a large heading and paragraph -->
        <section class="hero">
            <h2>Hello, World!</h2>
            <p>This is a simple demonstration website to showcase HTML, CSS, and JavaScript.</p>
            <!-- CTA (Call to Action) button -->
            <button id="ctaButton">Click Me!</button>
        </section>
    </main>

    <!-- The footer section of the website -->
    <footer>
        <p>&copy; 2023 Hello World Demo. All rights reserved.</p>
    </footer>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
