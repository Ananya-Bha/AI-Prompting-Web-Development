<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddle 2 - Pirate's Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="riddle-page riddle-2">
    <div class="content">
        <h1>Riddle 2: The Captain's Chest</h1>
        <p class="riddle">
            I have cities, but no houses. I have mountains, but no trees. I have water, but no fish. What am I?
        </p>
        <form id="riddleForm">
            <input type="text" id="answer" placeholder="Enter your answer" required>
            <button type="submit">Submit Answer</button>
        </form>
        <button id="hintButton">Get a Hint</button>
        <p id="hintText" class="hidden">Hint: Pirates use me to find their way across the seas.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
