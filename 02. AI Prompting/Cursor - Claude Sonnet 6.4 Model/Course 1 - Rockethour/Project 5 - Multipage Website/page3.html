<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddle 3 - Pirate's Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="riddle-page riddle-3">
    <div class="content">
        <h1>Riddle 3: The Kraken's Secret</h1>
        <p class="riddle">
            I am not alive, but I grow; I don't have lungs, but I need air; I don't have a mouth, but water kills me. What am I?
        </p>
        <form id="riddleForm">
            <input type="text" id="answer" placeholder="Enter your answer" required>
            <button type="submit">Submit Answer</button>
        </form>
        <button id="hintButton">Get a Hint</button>
        <p id="hintText" class="hidden">Hint: Pirates fear me on their wooden ships.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
