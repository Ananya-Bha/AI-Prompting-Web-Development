<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riddle 1 - Pirate's Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="riddle-page riddle-1">
    <div class="content">
        <h1>Riddle 1: The Pirate's Parrot</h1>
        <p class="riddle">
            I speak without a mouth and hear without ears. I have no body, but I come alive with the wind. What am I?
        </p>
        <form id="riddleForm">
            <input type="text" id="answer" placeholder="Enter your answer" required>
            <button type="submit">Submit Answer</button>
        </form>
        <button id="hintButton">Get a Hint</button>
        <p id="hintText" class="hidden">Hint: I'm often found on ships, helping sailors navigate.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
