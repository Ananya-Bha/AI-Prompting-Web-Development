<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Navbar Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header section -->
    <header>
        <h1>Matrix Navbar Demo</h1>
        <!-- Horizontal navigation bar -->
        <nav class="horizontal-nav">
            <ul>
                <li><a href="#" data-section="home">Home</a></li>
                <li><a href="#" data-section="about">About</a></li>
                <li><a href="#" data-section="contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero section with matrix background -->
    <section class="hero">
        <div class="matrix-bg"></div>
        <div class="hero-content">
            <h2 id="hero-title">Welcome to the Matrix</h2>
            <p id="hero-text">Explore different navigation styles in this demo.</p>
        </div>
    </section>

    <!-- Vertical navigation bar -->
    <nav class="vertical-nav">
        <ul>
            <li><a href="#" data-section="home">Home</a></li>
            <li><a href="#" data-section="about">About</a></li>
            <li><a href="#" data-section="contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hamburger menu icon -->
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Hamburger menu -->
    <nav class="hamburger-menu">
        <ul>
            <li><a href="#" data-section="home">Home</a></li>
            <li><a href="#" data-section="about">About</a></li>
            <li><a href="#" data-section="contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2023 Matrix Navbar Demo. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
