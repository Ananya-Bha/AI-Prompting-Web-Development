<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Formula Solver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Quadratic Formula Solver</h1>
        <p class="formula">x = (-b ± √(b² - 4ac)) / (2a)</p>
        <form id="quadraticForm">
            <div class="input-group">
                <label for="a">a:</label>
                <input type="number" id="a" required>
            </div>
            <div class="input-group">
                <label for="b">b:</label>
                <input type="number" id="b" required>
            </div>
            <div class="input-group">
                <label for="c">c:</label>
                <input type="number" id="c" required>
            </div>
            <div class="input-group">
                <label for="method">Method:</label>
                <select id="method">
                    <option value="addition">Addition</option>
                    <option value="subtraction">Subtraction</option>
                </select>
            </div>
            <button type="submit">Solve</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
