<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body id="page" class="page">
  <div id="app" class="app">
    <h1 id="title" class="title">Pick your buddy</h1>
    <p id="caption" class="caption">Choose one — we'll hide them in a box.</p>

    <!-- SETUP mode: buddy picker. Hidden once a buddy is saved. -->
    <div id="setup" class="setup">
      <button id="pick-duck" class="card" onclick="pickDuck()">
        <img class="card-img" src="images/duck.png" alt="">
        <span class="card-label">DUCK</span>
      </button>
      <button id="pick-cat" class="card" onclick="pickCat()">
        <img class="card-img" src="images/cat.png" alt="">
        <span class="card-label">CAT</span>
      </button>
    </div>

    <!-- GAME mode: hidden until a buddy is picked. -->
    <div id="game" class="game hidden">
      <p id="stats" class="stats">Clicks: <span id="clicks">0</span> &middot; Best: <span id="best">—</span></p>

      <p id="boxes" class="boxes">
        <button id="box-1" class="box" onclick="look1()">1</button>
        <button id="box-2" class="box" onclick="look2()">2</button>
        <button id="box-3" class="box" onclick="look3()">3</button>
        <button id="box-4" class="box" onclick="look4()">4</button>
        <button id="box-5" class="box" onclick="look5()">5</button>
        <button id="box-6" class="box" onclick="look6()">6</button>
        <button id="box-7" class="box" onclick="look7()">7</button>
        <button id="box-8" class="box" onclick="look8()">8</button>
        <button id="box-9" class="box" onclick="look9()">9</button>
        <button id="box-10" class="box" onclick="look10()">10</button>
      </p>

      <img id="buddy-reveal" class="buddy-reveal hidden" src="" alt="Your buddy">

      <p id="actions" class="actions">
        <button id="play-again" class="play-again hidden" onclick="playAgain()">PLAY AGAIN</button>
        <button id="forget-buddy" class="forget-buddy" onclick="forgetBuddy()">FORGET MY BUDDY</button>
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
