<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome!</title>
    <style>
        body {
            background: #f4faff;
            color: #1a237e;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            border: 2px solid #1976d2;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(25, 118, 210, 0.08);
            padding: 40px 32px 32px 32px;
            text-align: center;
            min-width: 320px;
            transition: filter 0.3s;
        }
        .blurred {
            filter: blur(5px);
        }
        h1 {
            color: #1976d2;
            margin-bottom: 18px;
        }
        .subtitle {
            font-size: 1em;
            margin-bottom: 12px;
            color: #1565c0;
            font-weight: 500;
        }
        input[type="text"] {
            padding: 10px 12px;
            font-size: 1em;
            border: 2px solid #90caf9;
            border-radius: 6px;
            outline: none;
            margin-bottom: 18px;
            width: 80%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #1976d2;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        button {
            padding: 10px 32px;
            font-size: 1.1em;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.10);
            transition: background 0.2s, transform 0.1s, box-shadow 0.1s;
        }
        button:hover {
            background: #1565c0;
        }
        button:active {
            background: #0d47a1;
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(25, 118, 210, 0.12);
        }
    </style>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(25, 118, 210, 0.10);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border: 2px solid #1976d2;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(25, 118, 210, 0.15);
            padding: 32px 28px 24px 28px;
            min-width: 260px;
            text-align: center;
            color: #1a237e;
            position: relative;
        }
        .modal-message {
            font-size: 1.1em;
            margin-bottom: 18px;
        }
        .close-modal-btn {
            padding: 8px 24px;
            font-size: 1em;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s, box-shadow 0.1s;
        }
        .close-modal-btn:hover {
            background: #1565c0;
        }
        .close-modal-btn:active {
            background: #0d47a1;
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <div class="subtitle">Please enter you name below:</div>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <div class="button-container">
            <button onclick="sayHello()">Say hello</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-message" id="modalMessage"></div>
            <button class="close-modal-btn" onclick="closeModal()">Close</button>
        </div>
    </div>
    <script>
        function sayHello() {
            var name = document.getElementById('nameInput').value.trim();
            var modalOverlay = document.getElementById('modalOverlay');
            var modalMessage = document.getElementById('modalMessage');
            var container = document.querySelector('.container');
            if (name) {
                modalMessage.textContent = 'Hello, ' + name + '!';
            } else {
                modalMessage.textContent = 'This field has not been filled, please enter your name';
            }
            modalOverlay.classList.add('active');
            container.classList.add('blurred');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.querySelector('.container').classList.remove('blurred');
        }
        // Optional: allow closing modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
